name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Las capturas dependen de fuentes locales; se excluyen en CI.
      - run: flutter test --exclude-tags screenshots

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      # El icono de la notificación del reproductor se usa por nombre desde
      # Dart; si la reducción de recursos lo elimina, la app se cierra al
      # reproducir ("no valid small icon").
      - name: Comprobar icono de notificación en el APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump resources build/app/outputs/flutter-apk/app-release.apk \
            | grep -q "drawable/ic_stat_notification" \
            && echo "OK: ic_stat_notification presente" \
            || { echo "::error::Falta drawable/ic_stat_notification en el APK"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: euskadigital-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      # Compila sin firmar para verificar que el proyecto iOS es correcto.
      - run: flutter build ios --release --no-codesign
