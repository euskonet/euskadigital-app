name: iOS en el navegador (Appetize)

# Compila la app para el simulador de iOS y la publica en Appetize.io para
# probarla desde el navegador. Se lanza a mano desde Actions.
#
# Requisitos:
#   - Secreto APPETIZE_API_TOKEN (Appetize → Settings → API token).
#   - Tras la primera ejecución, poner la publicKey que aparece en el
#     resumen en APPETIZE_PUBLIC_KEY (abajo) para que las siguientes
#     actualicen la misma app en lugar de crear otra.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APPETIZE_PUBLIC_KEY: 'tfpkz7ld6nzt2ynasemj4igaby'
  RELEASE_TAG: simulador-ios
  ZIP_NAME: EuskaDigital-simulador-ios.zip

jobs:
  appetize:
    # Mac Intel: los Mac Apple Silicon de GitHub tienen colas por falta de capacidad.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get

      # En el simulador Flutter solo admite el modo debug.
      - run: flutter build ios --simulator --debug

      - name: Comprimir el .app
        run: |
          cd build/ios/iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/$ZIP_NAME" Runner.app
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      # Appetize descarga la app desde un enlace público: se deja en una
      # pre-release de pruebas del repositorio.
      - name: Publicar el .zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si la pre-release ya existe, se reutiliza.
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Pruebas: iOS en simulador" \
            --notes "Compilación de pruebas para el simulador de iOS (Appetize). No es una versión publicada." \
            || echo "La pre-release $RELEASE_TAG ya existe; se actualiza el fichero."
          gh release upload "$RELEASE_TAG" "$ZIP_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Subir a Appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "::error::Falta el secreto APPETIZE_API_TOKEN"; exit 1
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${ZIP_NAME}"
          BODY=$(jq -n --arg url "$URL" --arg note "EuskaDigital ${GITHUB_SHA::7}" \
            '{url: $url, platform: "ios", fileType: "zip", note: $note}')
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            ENDPOINT="https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY"
          else
            ENDPOINT="https://api.appetize.io/v1/apps"
          fi
          # La respuesta incluye una clave privada: no se imprime nunca.
          HTTP=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" -H "Content-Type: application/json" -d "$BODY")
          KEY=$(jq -r '.publicKey // empty' resp.json)
          ERR=$(jq -r '.message // .error // empty' resp.json 2>/dev/null)
          rm -f resp.json
          if [ "$HTTP" != "200" ] || [ -z "$KEY" ]; then
            echo "::error::Appetize respondió HTTP $HTTP ${ERR}"; exit 1
          fi
          echo "Subido a Appetize: https://appetize.io/app/$KEY (versión actualizada)"
          {
            echo "## iOS en el navegador"
            echo ""
            echo "Abrir: https://appetize.io/app/$KEY"
            echo ""
            if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
              echo "Primera subida: guarda \`$KEY\` en APPETIZE_PUBLIC_KEY del flujo para que las próximas actualicen esta misma app."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
