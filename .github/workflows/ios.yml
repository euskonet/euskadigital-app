name: iOS

# Compilación de iOS (sin firmar) para comprobar que el proyecto es correcto.
# Va aparte del CI porque los Mac de GitHub tienen colas largas por falta de
# capacidad: se lanza una vez por semana y a mano, y el flujo Release lo llama
# antes de publicar una versión.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  workflow_call:

jobs:
  ios:
    # Mac Intel: los Mac Apple Silicon de GitHub tienen colas por falta de capacidad.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
