name: iOS

# Compilación de iOS (sin firmar) para comprobar que el proyecto es correcto.
# Va aparte del CI porque los Mac de GitHub tienen colas largas por falta de
# capacidad: se lanza una vez por semana, al publicar una versión y a mano.
on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
