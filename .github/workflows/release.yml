name: Release

# Al subir una etiqueta de versión (p. ej. v3.0.0) se compila la app de
# Android y se publica una release con el APK y el AAB para Google Play.
#
# Antes de publicar se comprueba que la etiqueta coincide con la versión de
# pubspec.yaml, que el análisis y los tests pasan y que iOS compila. Las
# versiones publicadas no se rehacen: para corregir algo se sube el número.
#
# Firma: si existen los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD se firma con esa clave; si no, con la
# clave de depuración (válida para instalar, no para Google Play).
on:
  push:
    tags: ['v*']
  # Lanzamiento manual desde la pestaña Actions: crea la etiqueta (si no
  # existe) sobre la rama elegida y publica la release.
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la versión (p. ej. v3.0.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(awk '$1 == "version:" { split($2, v, "+"); print v[1]; exit }' pubspec.yaml)
          if [ -z "$VERSION" ] || [ "$TAG" != "v$VERSION" ]; then
            echo "::error::La etiqueta $TAG no coincide con la versión de pubspec.yaml ($VERSION)."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::La release $TAG ya existe. Sube la versión en pubspec.yaml y publica una nueva."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags screenshots

  ios:
    needs: check
    uses: ./.github/workflows/ios.yml

  android:
    needs: [check, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave de firma: se usa la clave de depuración."
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Certificado de firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "DN:|SHA-1|SHA-256"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${TAG#v}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/EuskaDigital-$V.apk"
          FILES="dist/EuskaDigital-$V.apk"
          # El AAB solo sirve para Google Play si está firmado con la clave de subida.
          if [ "$SIGNED" = "release" ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/EuskaDigital-$V.aab"
            FILES="$FILES dist/EuskaDigital-$V.aab"
          fi
          NOTES=".github/release/notas-$V.md"
          [ -f "$NOTES" ] || { echo "EuskaDigital $V" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          gh release create "$TAG" $FILES --title "EuskaDigital $V" --notes-file "$NOTES" --target "$GITHUB_SHA"
